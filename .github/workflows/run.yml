name: Generate 1-Year Tamil Calendar
on:
  schedule:
    - cron: '5 0 * * *' # Refreshes every day to maintain a moving window
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2  # Updated safe release

      - name: Setup Python
        uses: actions/setup-python@v5.3.0  # Updated safe release
        with:
          python-version: '3.10'

      - name: Execute Script
        run: python generate_ics.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add calendar.ics || true
          git commit -m "Update 1-year calendar view" || exit 0
          git pull --rebase origin main
          git push origin main
